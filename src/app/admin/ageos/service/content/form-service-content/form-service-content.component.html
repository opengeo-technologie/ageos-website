<div class="row">
  <div class="col s12 m12">
    <div class="card hoverable">
      <form
        (ngSubmit)="onSubmit()"
        style="padding: 30px"
        *ngIf="serviceContent"
        #bannerForm="ngForm"
      >
        <!-- <h5 class="center">Gestion du contenu</h5> -->
        <div class="divider"></div>
        <div class="form-group">
          <label for="name">Service <span class="red-text">(*)</span></label>
          <select
            class="browser-default"
            disabled
            name="type"
            [(ngModel)]="serviceContent.service"
            #typeC="ngModel"
            [compareWith]="compareFn"
            required
          >
            <option [ngValue]="null" disabled>Choisir le service</option>
            <option *ngFor="let item of services" [ngValue]="item">
              {{ item.name }}
            </option>
          </select>

          <span
            [hidden]="typeC.valid || typeC.pristine"
            class="red-text accent-1"
          >
            Type required.
          </span>
        </div>
        <div>
          <label for="description">Contenu en francais:</label>
          <quill-editor
            class="validate"
            [(ngModel)]="serviceContent.content"
            [ngModelOptions]="{ standalone: false }"
            name="content"
            #content="ngModel"
          ></quill-editor>
          <div
            [hidden]="content.valid || content.pristine"
            class="red-text accent-1"
          >
            Ce champ est obligatoire.
          </div>
        </div>
        <div>
          <label for="description">Contenu en anglais:</label>
          <quill-editor
            class="validate"
            [(ngModel)]="serviceContent.content_eng"
            [ngModelOptions]="{ standalone: false }"
            name="content_eng"
            #content_eng="ngModel"
          ></quill-editor>
          <div
            [hidden]="content_eng.valid || content_eng.pristine"
            class="red-text accent-1"
          >
            Ce champ est obligatoire.
          </div>
        </div>
        <div class="row" *ngIf="isAddForm">
          <div class="file-field input-field col s12 m6">
            <div class="btn-small blue-grey">
              <span>Image 1</span>
              <input
                type="file"
                [(ngModel)]="serviceContent.image_1"
                id="image_1"
                class="validate"
                name="image_1"
                [ngModelOptions]="{ standalone: false }"
                #image_1="ngModel"
              />
            </div>
            <div class="file-path-wrapper">
              <input class="file-path validate" type="text" />
            </div>
            <div
              [hidden]="image_1.valid || image_1.pristine"
              class="red-text accent-1"
            >
              Ce champ est obligatoire.
            </div>
          </div>
          <div class="file-field input-field col s12 m6">
            <div class="btn-small blue-grey">
              <span>Image 2</span>
              <input
                type="file"
                [disabled]="serviceContent.image_1 == ''"
                [(ngModel)]="serviceContent.image_2"
                id="image_2"
                [ngModelOptions]="{ standalone: true }"
              />
            </div>
            <div class="file-path-wrapper">
              <input class="file-path validate" type="text" />
            </div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row" style="padding-top: 10px">
          <div class="center" *ngIf="isAddForm">
            <button
              type="submit"
              class="btn-small green darken-4"
              style="margin-top: 0 !important; padding-top: 0 !important"
              [disabled]="
                !bannerForm.form.valid || isBlank(serviceContent.content)
              "
            >
              <i class="material-icons">save</i> Enregistrer
            </button>
          </div>

          <div class="center" *ngIf="!isAddForm">
            <button
              type="submit"
              class="btn-small green darken-4"
              style="margin-top: 0 !important; padding-top: 0 !important"
              [disabled]="!bannerForm.form.valid"
            >
              <i class="material-icons">save</i> Modifier
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
